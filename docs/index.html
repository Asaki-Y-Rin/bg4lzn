<html data-static="1" lang="zh">

  <style>
/* ===== BG4LZN 电波小窝 — 浅色 ins 风 ===== */
:root {
  --bg: #faf8f4;
  --bg-soft: #f4efe7;
  --card: #ffffff;
  --ink: #3a3530;
  --ink-soft: #7d766d;
  --ink-faint: #aaa297;
  --line: #efe7dc;
  --accent: #f79e7e;
  --accent-2: #ffb9a0;
  --accent-deep: #f0795a;
  --accent-tint: #fdeee6;
  --blue: #7fb9c9;
  --shadow: 0 10px 30px rgba(160, 130, 100, .10);
  --shadow-sm: 0 4px 14px rgba(160, 130, 100, .08);
  --radius: 22px;
  --radius-sm: 14px;
  --font: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; }

/* ---- utility ---- */
.container { max-width: 1080px; margin: 0 auto; padding: 0 22px; }
.hidden { display: none !important; }
.section-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
.section-sub { color: var(--ink-soft); font-size: 14px; margin-bottom: 26px; }

/* ---- pills / badges ---- */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 100px; font-size: 12px; font-weight: 600;
  background: var(--accent-tint); color: var(--accent-deep); border: 1px solid #f7d7c9;
}
.pill.blue { background: #e8f3f6; color: #3f7f8f; border-color: #d0e6ec; }
.pill.grey { background: #f1ede7; color: var(--ink-soft); border-color: #e7e0d6; }

.live-dot { width: 8px; height: 8px; border-radius: 50%; background: #4cc88a; box-shadow: 0 0 0 4px rgba(76,200,138,.18); }
.live-dot.on { background: #4cc88a; box-shadow: 0 0 0 4px rgba(76,200,138,.18); }
.live-dot.off { background: #c6beb1; box-shadow: 0 0 0 4px rgba(198,190,177,.22); }
.status-chip.status-chip { flex-direction: row; align-items: center; padding: 14px 26px; gap: 0; min-width: 150px; justify-content: flex-start; }
.status-chip.status-chip .n { display: inline-flex; align-items: center; }
.status-chip.status-chip .l { color: var(--accent-deep); font-size: 28px; font-weight: 800; letter-spacing: 1.5px; line-height: 1; white-space: nowrap; }
.status-chip .live-dot { width: 15px; height: 15px; margin-right: 6px; box-shadow: 0 0 0 3px rgba(76,200,138,.16); }
.status-chip .live-dot.off { box-shadow: 0 0 0 3px rgba(198,190,177,.2); }
.status-chip.off .l { color: var(--accent-deep); }
.onair-detail { margin-top: 14px; display: inline-flex; background: rgba(255,255,255,.82); border: 1px solid var(--line); border-radius: 14px; padding: 11px 20px; font-size: 15px; color: var(--ink-soft); gap: 6px; }
.onair-detail.on { color: var(--accent-deep); border-color: #f3d6c6; }

/* quick access cards */
.quick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 14px; margin: 0 0 26px; }
.quick-card { padding: 18px 14px; text-align: center; transition: transform .18s ease, box-shadow .18s ease; }
.quick-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.quick-card .qc-ico { font-size: 26px; margin-bottom: 8px; }
.quick-card .qc-t { font-size: 14px; font-weight: 700; }
.quick-card .qc-d { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }

/* ---- buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 22px; border-radius: 100px; font-size: 14px; font-weight: 600;
  border: 1px solid transparent; transition: all .2s ease; background: var(--ink); color: #fff;
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.btn.accent { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
.btn.ghost { background: #fff; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent-deep); }
.btn.small { padding: 7px 14px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---- cards ---- */
.card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); border: 1px solid var(--line); overflow: hidden;
}

/* ===== TOP NAV ===== */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(250, 248, 244, .8); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.nav-inner { display: flex; align-items: center; gap: 22px; padding: 14px 22px; max-width: 1080px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo {
  width: 38px; height: 38px; border-radius: 12px; overflow: hidden;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 16px;
}
.logo img, .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
.brand .t { font-weight: 800; font-size: 17px; letter-spacing: -0.3px; }
.brand .s { font-size: 11px; color: var(--ink-soft); letter-spacing: 2px; }
.nav-links { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav-link {
  padding: 8px 15px; border-radius: 100px; font-size: 14px; font-weight: 600; color: var(--ink-soft);
  transition: all .18s ease;
}
.nav-link:hover { color: var(--accent-deep); }
.nav-link.active { background: #fff; color: var(--accent-deep); box-shadow: var(--shadow-sm); }
.lang-toggle { display: flex; gap: 3px; background: #fff; border: 1px solid var(--line); border-radius: 100px; padding: 3px; }
.lang-toggle button { border: none; background: none; padding: 5px 11px; border-radius: 100px; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.lang-toggle button.active { background: var(--accent-deep); color: #fff; }

/* ===== HOME ===== */
.home-hero {
  position: relative; border-radius: 28px; overflow: hidden;
  min-height: 340px; display: flex; align-items: center;
  background: linear-gradient(135deg, #fdeee6, #f7d8c8, #e9eef2);
  padding: 44px 40px; margin: 26px 0 30px; box-shadow: var(--shadow);
}
.home-hero .overlay { position: absolute; inset: 0; background: radial-gradient(circle at 80% 20%, rgba(255,255,255,.6), transparent 60%); }
.home-hero .content { position: relative; z-index: 1; }
.home-hero .callsign { font-size: 52px; font-weight: 800; letter-spacing: 1px; line-height: 1; }
.home-hero .callsign span { color: var(--accent-deep); }
.home-hero .sub { margin-top: 12px; color: var(--ink-soft); font-size: 15px; max-width: 480px; }
.status-strip { display: flex; gap: 14px; margin-top: 24px; flex-wrap: wrap; }
.stat-chip {
  background: rgba(255,255,255,.8); border-radius: 16px; padding: 12px 18px; backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,.6); display: flex; flex-direction: column;
}
.stat-chip .n { font-size: 22px; font-weight: 800; color: var(--accent-deep); }
.stat-chip .l { font-size: 12px; color: var(--ink-soft); }

.home-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 26px; align-items: start; }
@media (max-width: 820px) { .home-grid { grid-template-columns: 1fr; } }

.posts-preview { display: grid; gap: 18px; }
.post-card { display: flex; gap: 16px; padding: 16px; }
.post-card .cover { width: 130px; height: 96px; border-radius: 14px; object-fit: cover; background: var(--bg-soft); flex-shrink: 0; }
.post-card .p-body { flex: 1; min-width: 0; }
.post-card .p-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.post-card .p-excerpt { font-size: 13.5px; color: var(--ink-soft); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.post-card .p-meta { margin-top: 8px; font-size: 12px; color: var(--ink-faint); display: flex; gap: 12px; }

.radioside { display: flex; flex-direction: column; gap: 18px; }
.radioside .card { padding: 20px; }
.radioside h4 { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.qso-mini { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.qso-mini:last-child { border-bottom: none; }
.qso-mini .c { font-weight: 700; }
.qso-mini .meta { color: var(--ink-soft); font-size: 12px; }
.band-chip { display: inline-block; padding: 2px 8px; border-radius: 8px; background: var(--accent-tint); color: var(--accent-deep); font-size: 11px; font-weight: 700; }

/* ===== ABOUT ===== */
.about-wrap { display: grid; grid-template-columns: 220px 1fr; gap: 30px; }
@media (max-width: 720px) { .about-wrap { grid-template-columns: 1fr; } }
.avatar {
  aspect-ratio: 1; border-radius: 28px; overflow: hidden;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid; place-items: center; font-size: 60px; font-weight: 800; color: #fff;
  box-shadow: var(--shadow);
}
.about-info .h { font-size: 30px; font-weight: 800; }
.about-info .role { color: var(--accent-deep); font-weight: 600; margin: 4px 0 16px; }
.about-card { padding: 24px; }
.about-card h5 { font-size: 15px; margin-bottom: 8px; color: var(--ink); }
.about-card p { font-size: 14px; color: var(--ink-soft); }
.meta-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
.meta-item { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 13px; }
.meta-item b { display: block; font-size: 12px; color: var(--ink-faint); font-weight: 500; }

/* ===== ARTICLES ===== */
.article-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; }
.article-card { padding: 0; transition: transform .2s ease, box-shadow .2s ease; }
.article-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
.article-card .ac-cover { height: 150px; background: linear-gradient(135deg, #fdeee6, #f2d9c6); display: grid; place-items: center; color: #fff; font-size: 30px; }
.article-card .ac-body { padding: 18px; }
.article-card .ac-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.article-card .ac-excerpt { font-size: 13px; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.article-card .ac-foot { display: flex; justify-content: space-between; margin-top: 14px; font-size: 12px; color: var(--ink-faint); }
.article-card .ac-foot .likes { color: var(--accent-deep); }

/* ---- article detail ---- */
.article-detail .card { padding: 36px; }
.article-detail h1 { font-size: 30px; font-weight: 800; line-height: 1.3; }
.ad-meta { color: var(--ink-faint); font-size: 13px; margin: 12px 0 26px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.ad-content { font-size: 16px; color: #3c3833; white-space: pre-wrap; }
.ad-content p { margin: 14px 0; }
.ad-cover { width: 100%; max-height: 380px; object-fit: cover; border-radius: 14px; margin-bottom: 22px; }
.ad-inline-img { display: block; width: 100%; max-width: 100%; height: auto; border-radius: 12px; margin: 18px auto; cursor: zoom-in; }
.ad-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin: 22px 0 0; }
.ad-gallery figure { margin: 0; }
.ad-gallery img { width: 100%; height: 220px; object-fit: cover; border-radius: 12px; display: block; cursor: zoom-in; }
.qsl-addr { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line); }
.qsl-addr-block .qsl-t { font-weight: 700; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
.qsl-addr-block pre { margin: 0; font-family: inherit; font-size: 14px; line-height: 1.7; color: #3c3833; white-space: pre-wrap; }
@media (max-width: 640px) { .qsl-addr { grid-template-columns: 1fr; } }
.adm-thumbs { display: flex; flex-wrap: wrap; gap: 10px; margin: 4px 0 10px; }
.adm-thumbs figure { position: relative; margin: 0; }
.adm-thumbs img { width: 88px; height: 88px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
.adm-thumbs .x { position: absolute; top: -8px; right: -8px; }
.like-bar { display: flex; align-items: center; gap: 16px; margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--line); }
.like-btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 100px;
  border: 1px solid var(--line); background: #fff; font-size: 15px; font-weight: 700; color: var(--ink-soft);
  transition: all .2s ease;
}
.like-btn:hover, .like-btn.active { background: var(--accent-tint); border-color: var(--accent); color: var(--accent-deep); }
.like-btn.active svg { fill: var(--accent-deep); }
.comments { margin-top: 30px; }
.comments h3 { font-size: 18px; font-weight: 700; margin-bottom: 18px; }
.comment { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.comment .c-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg,var(--accent-2),var(--accent)); color: #fff; display: grid; place-items: center; font-weight: 700; flex-shrink: 0; }
.comment .c-body { flex: 1; }
.comment .c-name { font-size: 14px; font-weight: 700; }
.comment .c-time { font-size: 11px; color: var(--ink-faint); margin-left: 8px; }
.comment .c-text { font-size: 14px; color: var(--ink-soft); margin-top: 4px; }
.comment-form { margin-top: 24px; display: grid; gap: 12px; }
.comment-form input, .comment-form textarea { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; background: #fff; font-family: inherit; }
.comment-form textarea { min-height: 100px; resize: vertical; }
.comment-form input:focus, .comment-form textarea:focus { outline: none; border-color: var(--accent); }

/* ===== LOGS ===== */
.table-card { padding: 0; }
.table-scroll { overflow-x: auto; }
table.logs { width: 100%; border-collapse: collapse; }
table.logs th, table.logs td { padding: 13px 17px; text-align: left; font-size: 13.5px; }
table.logs thead th { background: var(--bg-soft); color: var(--ink-soft); font-size: 12px; font-weight: 700; letter-spacing: .5px; position: sticky; top: 0; }
table.logs tbody tr { border-top: 1px solid var(--line); transition: background .15s; }
table.logs tbody tr:hover { background: #fdf7f2; }
table.logs .c-call { font-weight: 800; }
table.logs .tdate { color: var(--ink-soft); }
.logpager { display: inline-flex; align-items: center; gap: 14px; }

/* ===== POTA ===== */
.pota-hero { padding: 26px; background: linear-gradient(135deg, #eef3f5, #fdeee6); }
.pota-hero h2 { font-size: 24px; font-weight: 800; }
.pota-hero p { color: var(--ink-soft); font-size: 14px; margin-top: 6px; }
.pota-frame { overflow: hidden; }
.pota-frame iframe { display: block; width: 100%; max-width: 1000px; height: 1250px; border: 0; margin: 0 auto; background: #fff; }
@media (max-width: 720px) { .pota-frame iframe { height: 1400px; } }

/* ===== GUESTBOOK ===== */
.gb-form { padding: 24px; display: grid; gap: 14px; }
.gb-form input { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; background: #fff; font-family: inherit; }
.gb-form textarea { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; background: #fff; min-height: 110px; resize: vertical; font-family: inherit; }
.gb-list { display: grid; gap: 16px; margin-top: 24px; }
.gb-item { padding: 20px; }
.gb-item .g-top { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
.gb-item .g-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg,var(--accent),var(--accent-2)); color: #fff; display: grid; place-items: center; font-weight: 800; }
.gb-item .g-name { font-weight: 700; }
.gb-item .g-date { font-size: 12px; color: var(--ink-faint); }
.gb-item .g-text { font-size: 15px; color: #3c3833; }

/* ===== FOOTER ===== */
.footer { text-align: center; padding: 40px 20px 30px; color: var(--ink-faint); font-size: 13px; }
.footer .call { font-weight: 700; color: var(--ink-soft); letter-spacing: 1px; }

/* ===== LOADING / EMPTY ===== */
.loading { text-align: center; padding: 60px; color: var(--ink-faint); }
.spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 50px 20px; color: var(--ink-faint); }
.empty .e-ico { font-size: 40px; opacity: .4; margin-bottom: 10px; }

/* toast */
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 100px; font-size: 14px; opacity: 0; transition: all .3s ease; z-index: 999; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 720px) {
  .home-hero { min-height: 280px; padding: 32px 26px; }
  .home-hero .callsign { font-size: 38px; }
  .nav-inner { flex-wrap: wrap; gap: 12px; }
  .nav-links { order: 3; width: 100%; overflow-x: auto; padding-bottom: 4px; }
  .article-detail .card { padding: 24px; }
}

.article-card .ac-cover-img { width: 100%; height: 150px; object-fit: cover; display: block; }

.back-round { display: none; width: 42px; height: 42px; border-radius: 50%; align-items: center; justify-content: center; background: #fff; color: var(--ink); border: 1px solid var(--line); font-size: 20px; flex-shrink: 0; text-decoration: none; transition: all .2s ease; }
.back-round:hover { border-color: var(--accent); color: var(--accent-deep); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.back-round.show { display: inline-flex; }

.lightbox { position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; padding: 20px; }
.lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 10px; object-fit: contain; }
.lightbox .lb-close { position: absolute; top: 18px; right: 22px; width: 42px; height: 42px; border-radius: 50%; border: none; background: rgba(255,255,255,.18); color: #fff; font-size: 24px; line-height: 1; cursor: pointer; }
.lightbox .lb-close:hover { background: rgba(255,255,255,.32); }
.like-btn { cursor: pointer; }
.like-btn.active { color: #e05f3a; border-color: #f5c8b4; background: #fdeee6; }

/* ---- transitions + particles ---- */
#fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.nav, #app, .footer { position: relative; z-index: 1; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
#app.route-anim { animation: fadeUp .5s ease; }
.card { transition: transform .25s ease, box-shadow .25s ease, border-color .2s ease; }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.logs tr { transition: background .2s ease; }
.logs tr:hover { background: var(--bg-soft); }

.m-email{color:var(--accent,#1a73e8);text-decoration:none;border-bottom:1px dotted var(--accent,#1a73e8);}.m-email:hover{color:var(--accent,#1a73e8);text-decoration:underline;}
/* open-source footer link */
.footer .oss{margin-top:5px;font-size:12px;}
.footer .oss a{color:#a09487;text-decoration:underline;}

</style>

  <script>// ---- static-mode fetch shim: articles proxied to Do-Blog backend (api.bg4lzn.online), rest from embedded data ----

(function () {

  function resp(obj, status) {
    return Promise.resolve(new Response(JSON.stringify(obj), { status: status || 200, headers: { 'Content-Type': 'application/json' } }));
  }
  function sorted(list) {
    return list.slice().sort(function (a, b) { return ((b.date || '') + (b.time || '')).localeCompare((a.date || '') + (a.time || '')); });
  }
  function enriched() {

  }
  function apiLogs(u) {

      .sort(function (a, b) { return b.count - a.count || a.call.localeCompare(b.call); });
    var active = String(p.get('call') || '').toUpperCase() || (stations[0] ? stations[0].call : dc);
    var qq = String(p.get('q') || '').trim().toUpperCase();
    var list = all.filter(function (l) { return l.station === active; })
      .filter(function (l) { return !qq || String(l.call || '').toUpperCase().indexOf(qq) >= 0; });

    var per = Math.min(Math.max(parseInt(p.get('per'), 10) || 30, 1), 200);
    var total = list.length;
    var pages = Math.max(Math.ceil(total / per), 1);
    var page = Math.min(Math.max(parseInt(p.get('page'), 10) || 1, 1), pages);
    var start = (page - 1) * per;
    return { ok: true, stations: stations, activeCall: active, logs: list.slice(start, start + per), total: total, page: page, pages: pages, per: per, callsign: dc, lastSync: (D.logsInfo && D.logsInfo.lastSync) || null };
  }
  // ---- 内堂字段映射 (Do-Blog article -> 旧站 article) ----
  function mapArt(a) {
    return {
      id: String(a.id),
      title: a.title || '',
      date: String(a.published_at || a.created_at || '').slice(0, 10),
      cover: a.cover_image || '',
      excerpt: a.excerpt || '',
      content_md: a.content_md || '',
      content: a.content_md || a.content || '',
      likes: a.like_count || 0,
      views: a.read_count || 0,
      comments: 0,
      slug: a.slug || ''
    };
  }
  function fetchInner(path) {
    return OF(INNER + path, { headers: { Accept: 'application/json' } }).then(function (r) {
      return r.json();
    }).catch(function () { return null; });
  }
  function fetchInnerPost(path, body) {
    return OF(INNER + path, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(body) }).then(function (r) {
      return r.json();
    }).catch(function () { return null; });
  }
  // 内堂评论 -> 主站评论 {name, date, text}
  function mapComments(list) {
    return (list || []).map(function (c) {

  }
  var GUESTBOOK_ARTICLE = 2; // 内堂「留言板」文章 id
  // 内堂文章列表 -> 旧站 articles (按日期倒序)
  function proxyArticles() {
    return fetchInner('/api/articles?pageSize=50').then(function (j) {
      if (!j || !j.success) {
        // 回退静态数据
        var fallback = (D.articles || []).slice().sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
        return resp({ ok: true, articles: fallback });
      }
      var list = (j.data || []).slice().sort(function (a, b) { return String(b.published_at || '').localeCompare(String(a.published_at || '')); });
      return resp({ ok: true, articles: list.map(mapArt) });
    });
  }
  function proxyArticle(id) {
    var aid = encodeURIComponent(id);
    // 阅读计数上报 (fire-and-forget, 不阻塞渲染)
    fetchInnerPost('/api/articles/' + aid + '/read', {}).catch(function () {});

      fetchInner('/api/articles/' + aid),
      fetchInner('/api/articles/' + aid + '/comments')
    ]).then(function (rs) {
      var j = rs[0], cj = rs[1];
      if (!j || !j.success) {
        // 回退静态文章
        var fa = (D.articles || []).find(function (x) { return String(x.id) === String(id); });
        if (fa) {
          var fb = Object.assign({}, fa);
          if (!fb.content) fb.content = fb.content_md || '';
          return resp({ ok: true, article: fb, liked: false });
        }
        return resp({ ok: false, error: 'not_found' }, 404);
      }
      var art = mapArt(j.data);
      if (cj && cj.success) art.comments = (cj.data || []).length;
      return resp({ ok: true, article: art, liked: false });
    });
  }
  function proxyHome() {
    return Promise.all([
      fetchInner('/api/articles?pageSize=5'),
      fetchInner('/api/qso/summary'),
      fetchInner('/api/qso/stats'),
      fetchInner('/api/qso/onair'),
      fetchInner('/api/articles/' + GUESTBOOK_ARTICLE + '/comments')
    ]).then(function (rs) {
      var j = rs[0], qs = rs[1], qst = rs[2], oa = rs[3], g = rs[4];
      var arts = [];
      if (j && j.success) {
        arts = (j.data || []).slice().sort(function (a, b) { return String(b.published_at || '').localeCompare(String(a.published_at || '')); });
      } else {
        // 回退静态数据 (内堂不可达时首页仍有文章)
        arts = (D.articles || []).slice().sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });

      var lgs = (qs && qs.ok && Array.isArray(qs.logs)) ? qs.logs : [];

      var totalArticles = (j && j.success && j.pagination) ? (j.pagination.total || 0) : (j && j.success ? (j.data || []).length : (D.articles || []).length);

  }
  window.fetch = function (url, opts) {

    var method = ((opts && opts.method) || 'GET').toUpperCase();

        fetchInner('/api/qso/stats'),
        fetchInner('/api/articles/' + GUESTBOOK_ARTICLE + '/comments')

        var a = rs[0], q = rs[1], g = rs[2];
        var arts = (a && a.success && a.pagination) ? (a.pagination.total || 0) : ((a && a.data ? a.data.length : 0));

        if (!a || !a.success) arts = (D.articles || []).length;
        if (!q || !q.stats) logs = (D.logs || []).length;
        if (!g || !g.success) gbs = (D.guestbook || []).length;

    var likeM = u.match(/\/api\/articles\/([^/?#]+)\/like$/);

      }).then(function (j) {
        if (!j || !j.success) return resp({ ok: false, error: 'comment_failed' }, 400);
        return resp({ ok: true });
      });
    }
    if (/\/api\.php\?action=addguestbook/.test(u) && method === 'POST') {
      return (opts && opts.body ? Promise.resolve(opts.body) : Promise.resolve('{}')).then(function (raw) {

      }).then(function (j) {
        if (!j || !j.success) return resp({ ok: false, error: 'guestbook_failed' }, 400);
        return resp({ ok: true });
      });

    if (method !== 'GET') return resp({ ok: false, error: '静态导出仅支持浏览，评论/点赞/留言/后台需在线服务运行' }, 400);
    // ---- 内堂代理: 文章动态化 ----
    if (/\/api\/home$/.test(u)) return proxyHome();

    if (ma) return proxyArticle(decodeURIComponent(ma[1]));
    if (/\/api\/articles$/.test(u)) return proxyArticles();

      return fetchInner('/api/articles/' + encodeURIComponent(decodeURIComponent(cm[1])) + '/comments').then(function (j) {
        if (!j || !j.success) return resp({ ok: true, comments: [] });
        return resp({ ok: true, comments: mapComments(j.data) });
      });
    }
    if (/\/api\.php\?action=guestbook/.test(u)) {
      return fetchInner('/api/articles/' + GUESTBOOK_ARTICLE + '/comments').then(function (j) {

window.I18N.merge = function (copy) {
  if (!copy) return;
  if (copy.zh && typeof copy.zh === 'object') deepMerge(copy.zh, this.zh);
  if (copy.en && typeof copy.en === 'object') deepMerge(copy.en, this.en);
};
function deepMerge(src, dst) {
  for (const k in src) {
    if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k])) {
      if (!dst[k] || typeof dst[k] !== 'object') dst[k] = {};
      deepMerge(src[k], dst[k]);
    } else {
      dst[k] = src[k];
    }
  }

// 轻量 Markdown -> HTML (内堂文章为 Markdown)
function mdToHtml(md) {
  const esc = (s) => escapeHtml(s);
  return String(md || '')
    .split(/\n{2,}/)
    .map((block) => {
      const b = block.trim();
      if (!b) return '';
      if (/^#{1,3}\s/.test(b)) {
        const lv = b.match(/^(#{1,3})\s/)[1].length;
        return `<h${lv}>${esc(b.replace(/^#{1,3}\s/, ''))}</h${lv}>`;
      }
      if (/^```/.test(b)) {
        return `<pre><code>${esc(b.replace(/^```[a-zA-Z]*\n?/, '').replace(/```$/, ''))}</code></pre>`;
      }
      if (/^[-*]\s/.test(b)) {
        return `<ul>${b.split('\n').map((l) => `<li>${esc(l.replace(/^[-*]\s/, ''))}</li>`).join('')}</ul>`;
      }
      if (/^\d+\.\s/.test(b)) {
        return `<ol>${b.split('\n').map((l) => `<li>${esc(l.replace(/^\d+\.\s/, ''))}</li>`).join('')}</ol>`;
      }
      if (/^>\s/.test(b)) {
        return `<blockquote>${esc(b.replace(/^>\s/, ''))}</blockquote>`;
      }
      return `<p>${esc(b)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, '$1<em>$2</em>')
        .replace(/`([^`]+?)`/g, '<code>$1</code>')
        .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
        .replace(/\n/g, '<br>')}</p>`;
    })
    .join('\n');
}

function renderArticleBody(content, images, isMarkdown) {
  const imgs = Array.isArray(images) ? images : [];
  let text = String(content || '');
  // inline placement via [img:N]
  if (imgs.length && /\[img:/.test(text)) {
    const parts = text.split(/\[img:(\d+)\]/g);
    let html = '';
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 0) html += escapeHtml(parts[i]);
      else { const idx = parseInt(parts[i], 10); if (imgs[idx] !== undefined) html += `<img class="ad-inline-img" src="${escapeHtml(imgs[idx])}" loading="lazy">`; }
    }
    return html;
  }
  // no markers → text (Markdown 则渲染), then a gallery of illustrations below
  let html = isMarkdown ? mdToHtml(text) : escapeHtml(text);
  if (imgs.length) html += `<div class="ad-gallery">${imgs.map(u => `<figure><img src="${escapeHtml(u)}" loading="lazy"></figure>`).join('')}</div>`;
  return html;
}

}
function buildLogsToolbar(data) {
  const stationSel = `<select id="logCallSel" class="txt-input" style="max-width:230px;">
      ${(data.stations || []).map(s => `<option value="${escapeHtml(s.call)}" ${s.call === data.activeCall ? 'selected' : ''}>${escapeHtml(s.call)} (${s.count})</option>`).join('')}
    </select>`;
  document.getElementById('logsToolbar').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
      <div class="flex" style="flex-wrap:wrap;gap:10px;align-items:center;">
        <span class="section-sub" style="margin:0;">${escapeHtml(pick('请选择呼号：', 'Select callsign: '))}</span>${stationSel}
        <input class="txt-input" id="logSearch" placeholder="${escapeHtml(pick('搜索呼号…', 'Search callsign…'))}" value="${escapeHtml(logQuery)}" style="max-width:200px;">
      </div>
      <div class="pill blue" id="logCount"></div>
    </div>`;
  const search = document.getElementById('logSearch');
  let tm; search.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => { logQuery = search.value.trim(); logPage = 1; renderLogs(); }, 350); });
  const sel = document.getElementById('logCallSel');
  if (sel) sel.onchange = () => { logCall = sel.value; logPage = 1; renderLogs(); };
}
function renderLogResults(data) {
  const box = document.getElementById('logResults');
  const th = t('logs.th') || {};
  const logs = (data.logs || []).filter(Boolean);
  const page = data.page || 1, pages = data.pages || 1, total = data.total || 0;
  const count = document.getElementById('logCount');
  if (count) count.innerHTML = `${escapeHtml(pick('共', ''))} ${total} ${escapeHtml(t('logs.count'))}${data.lastSync ? ' · ' + escapeHtml(t('logs.lastSync')) + ': ' + escapeHtml(fmtDate(data.lastSync)) : ''}`;
  const pag = pages > 1 ? `<div class="logpager">
        <button class="btn ghost small" id="logPrev" ${page <= 1 ? 'disabled' : ''}>← ${escapeHtml(pick('上一页', 'Prev'))}</button>
        <span class="section-sub" style="margin:0;white-space:nowrap;">${escapeHtml(pick('第', 'Page '))} ${page} / ${pages}</span>
        <button class="btn ghost small" id="logNext" ${page >= pages ? 'disabled' : ''}>${escapeHtml(pick('下一页', 'Next'))} →</button>
      </div>` : '';
  box.innerHTML = `
      ${logs.length ? `<div class="card table-card"><div class="table-scroll"><table class="logs">
        <thead><tr>
          <th>${escapeHtml(th.date)}</th><th>${escapeHtml(th.time)}</th><th>${escapeHtml(th.call)}</th><th>${escapeHtml(th.freq)}</th><th>${escapeHtml(th.mode)}</th>
        </tr></thead>
        <tbody>${logs.map(l => `<tr>
          <td class="tdate">${escapeHtml(fmtDate(l.date))}</td>
          <td>${escapeHtml((l.time || '').slice(0, 8))} UTC</td>
          <td class="c-call">${escapeHtml(l.call || '')}</td>
          <td>${escapeHtml(l.freq || l.band || '')}</td>
          <td>${escapeHtml(l.mode || '')}</td>
        </tr>`).join('')}</tbody>
      </table></div></div>` : `<div class="card" style="padding:50px;text-align:center;"><div class="empty"><div class="e-ico">📤</div>${escapeHtml(t('logs.empty'))}</div></div>`}
      <div style="display:flex;justify-content:center;margin-top:16px;">${pag}</div>
    `;
  const prev = document.getElementById('logPrev'), next = document.getElementById('logNext');
  if (prev) prev.onclick = () => { logPage = Math.max(page - 1, 1); renderLogs(); };
  if (next) next.onclick = () => { logPage = Math.min(page + 1, pages); renderLogs(); };
}
async function renderPota() {
  const box = qs('#potaWrap');
  try {
    const { spots } = await fetchJSON('/api/pota');
    const th = t('pota.th') || {};
    if (!spots || !spots.length) {
      box.innerHTML = `<div class="card" style="padding:50px;text-align:center;"><div class="empty"><div class="e-ico">🏞️</div>${escapeHtml(t('pota.empty'))}</div></div>`;
      return;
    }
    box.innerHTML = `<div class="card table-card"><div class="table-scroll"><table class="logs">
      <thead><tr><th>${escapeHtml(th.time)}</th><th>${escapeHtml(th.ref)}</th><th>${escapeHtml(th.park)}</th><th>${escapeHtml(th.freq)}</th><th>${escapeHtml(th.mode)}</th><th>${escapeHtml(th.note)}</th></tr></thead>
      <tbody>${spots.map(s => `<tr>
        <td class="tdate">${escapeHtml((s.spotTime||'').replace('T',' ').slice(0,19))}</td>
        <td><span class="pill">${escapeHtml(s.reference || s.ref || '')}</span></td>
        <td>${escapeHtml(s.name || s.parkName || '')}</td>
        <td>${escapeHtml(s.frequency || s.freq || '')}</td>

        <td>${escapeHtml(s.comments || s.spotter || '')}</td>

    </table></div></div>`;
  } catch (e) {
    box.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;

}
async function renderGuestbook() {
  const g = t('guestbook') || {};
  const list = qs('#gbList');
  qs('#gb-submit').onclick = async () => {
    const name = qs('#gb-name').value.trim(); const text = qs('#gb-text').value.trim();
    if (!text) return toast(pick('请先写点什么', 'Please write a message'));
    try {
      await fetchJSON('/api.php?action=addguestbook', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name, text }) });
      qs('#gb-name').value = ''; qs('#gb-text').value = '';
      toast(pick('留言已发布，73！', 'Message posted, 73!'));
      renderGuestbook();
    } catch (e) { toast(e.message); }
  };
  try {
    const gbd = await fetchJSON('/api.php?action=guestbook'); const messages = Array.isArray(gbd.messages) ? gbd.messages : (gbd.messages ? [gbd.messages] : []);
    if (!messages.length) list.innerHTML = `<div class="card" style="padding:50px;text-align:center;"><div class="empty"><div class="e-ico">📮</div>${escapeHtml(g.empty)}</div></div>`;
    else list.innerHTML = messages.map(m => `
      <div class="card gb-item">
        <div class="g-top">
          <div class="g-avatar">${escapeHtml((m.name||'N').slice(0,1).toUpperCase())}</div>
          <div><div class="g-name">${escapeHtml(m.name)}</div><div class="g-date">${escapeHtml(fmtDate(m.date))}</div></div>
        </div>
        <div class="g-text">${escapeHtml(m.text)}</div>
      </div>`).join('');
  } catch (e) {
    list.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
  }
}

// ---------- router ----------
async function router() {
  const hash = window.location.hash || '#/home';
  state.route = hash;
  const [_, page, id] = hash.split('/');
  renderNav('#' + page);
  const backRound = document.getElementById('backRound');
  if (backRound) backRound.classList.toggle('show', !(page === 'home' || !page));
  window.scrollTo({ top: 0, behavior: 'smooth' });
  try {
    if (page === 'home' || !page) { await renderHome(); }
    else if (page === 'about') { app.innerHTML = aboutView(); }
    else if (page === 'articles') { app.innerHTML = articlesView(); await renderArticles(); }
    else if (page === 'article') { app.innerHTML = articleDetailView(id); await renderArticleDetail(id); }
    else if (page === 'logs') { app.innerHTML = logsView(); await renderLogs(); }
    else if (page === 'pota') { app.innerHTML = await potaView(); }
    else if (page === 'guestbook') { app.innerHTML = guestbookView(); await renderGuestbook(); }
    else { app.innerHTML = homeView(); }
  } catch (e) {
    app.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
  }
  applyStaticI18n();
  app.classList.remove('route-anim');
  void app.offsetWidth;
  app.classList.add('route-anim');
}

function openImglb(src) {
  let lb = document.getElementById('imglb');
  if (lb) lb.remove();
  lb = document.createElement('div');
  lb.id = 'imglb'; lb.className = 'lightbox';
  lb.innerHTML = '<button class="lb-close" aria-label="Close">×</button><img src="' + escapeHtml(src) + '" alt="">';
  document.body.appendChild(lb);
  document.body.style.overflow = 'hidden';
  lb.addEventListener('click', (ev) => { if (ev.target === lb || ev.target.classList.contains('lb-close')) closeImglb(); });
}
function closeImglb() {
  const lb = document.getElementById('imglb');
  if (lb) lb.remove();
  document.body.style.overflow = '';
}
document.addEventListener('dblclick', (ev) => {
  const img = ev.target.closest && ev.target.closest('.ad-inline-img, .ad-gallery img');
  if (img) openImglb(img.src);
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') closeImglb(); });

  <script>
// Lightweight floating-particle background (ins-style, subtle pastel dots)
(function () {
  var cv = document.getElementById('fx');
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, ps = [];
  var COUNT = 28;
  var colors = ['rgba(242,201,179,', 'rgba(224,214,255,', 'rgba(196,224,250,', 'rgba(255,214,196,', 'rgba(214,242,224,'];
  function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
  function make() {
    return {
      x: Math.random() * W, y: Math.random() * H,
      r: 1.6 + Math.random() * 3.6,
      vx: (Math.random() - 0.5) * 0.22, vy: -(0.12 + Math.random() * 0.28),
      c: colors[(Math.random() * colors.length) | 0],
      a: 0.12 + Math.random() * 0.22,
      p: Math.random() * Math.PI * 2,
      ph: 0.01 + Math.random() * 0.02
    };
  }
  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < ps.length; i++) {
      var p = ps[i];
      p.x += p.vx; p.y += p.vy; p.p += p.ph;
      if (p.y < -24 || p.x < -24 || p.x > W + 24) ps[i] = make();
      var alpha = p.a * (0.55 + 0.45 * Math.sin(p.p));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.c + alpha.toFixed(3) + ')';
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  resize();
  for (var i = 0; i < COUNT; i++) ps.push(make());
  frame();
  window.addEventListener('resize', resize);
})();
</script>
