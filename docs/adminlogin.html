<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台登录 · BG4LZN 的电波小窝</title>
  <link rel="icon" href="https://i.ibb.co/wh8QLjNp/picture.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); padding: 20px; }
    .bg-orb { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
    .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .5; }
    .orb.o1 { width: 340px; height: 340px; background: #f9c9a8; top: -60px; left: -40px; }
    .orb.o2 { width: 300px; height: 300px; background: #c4e0e8; bottom: -70px; right: -40px; }
    .login-wrap { position: relative; z-index: 1; width: 100%; max-width: 400px; }
    .card { box-shadow: var(--shadow); }
    .login-card { padding: 40px 36px; }
    .logo-row { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
    .logo-row .logo { width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 22px; }
    .logo-row .t { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; }
    .logo-row .s { font-size: 11px; color: var(--ink-soft); letter-spacing: 3px; margin-top: 2px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 7px; font-weight: 600; }
    .field input { width: 100%; border: 1px solid var(--line); border-radius: 13px; padding: 13px 15px; font-size: 15px; background: #fff; font-family: inherit; transition: border .2s; }
    .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(247,158,126,.12); }
    .btn.full { width: 100%; margin-top: 6px; }
    .err { color: #e05656; font-size: 13px; min-height: 18px; margin: 4px 0 8px; }
    .back { display: block; text-align: center; margin-top: 18px; font-size: 13px; color: var(--ink-soft); }
    .back:hover { color: var(--accent-deep); }
  </style>
  <script>// ---- static-mode fetch shim: articles proxied to Do-Blog backend (api.bg4lzn.online), rest from embedded data ----
// BG4LZN 版: 主站(GitHub Pages) 文章动态化 —— 内堂管理、前台展示; 后台模拟只读
(function () {
  var D = window.__DATA__ || {};
  var dc = String((D.site && D.site.callsign) || 'BG4LZN').trim().toUpperCase();
  var OF = window.fetch;
  var INNER = 'https://api.bg4lzn.online';
  function resp(obj, status) {
    return Promise.resolve(new Response(JSON.stringify(obj), { status: status || 200, headers: { 'Content-Type': 'application/json' } }));
  }
  function sorted(list) {
    return list.slice().sort(function (a, b) { return ((b.date || '') + (b.time || '')).localeCompare((a.date || '') + (a.time || '')); });
  }
  function enriched() {
    return (D.logs || []).filter(Boolean).map(function (l) {
      var st = String(l.station || dc).trim().toUpperCase();
      var o = {};
      for (var k in l) o[k] = l[k];
      o.station = st || dc;
      return o;
    });
  }
  function apiLogs(u) {
    var q = '', i = u.indexOf('?');
    if (i >= 0) q = u.slice(i + 1);
    var p = new URLSearchParams(q);
    var all = enriched();
    var by = {};
    all.forEach(function (l) { by[l.station] = (by[l.station] || 0) + 1; });
    var stations = Object.keys(by).map(function (c) { return { call: c, count: by[c] }; })
      .sort(function (a, b) { return b.count - a.count || a.call.localeCompare(b.call); });
    var active = String(p.get('call') || '').toUpperCase() || (stations[0] ? stations[0].call : dc);
    var qq = String(p.get('q') || '').trim().toUpperCase();
    var list = all.filter(function (l) { return l.station === active; })
      .filter(function (l) { return !qq || String(l.call || '').toUpperCase().indexOf(qq) >= 0; });
    list = sorted(list);
    var per = Math.min(Math.max(parseInt(p.get('per'), 10) || 30, 1), 200);
    var total = list.length;
    var pages = Math.max(Math.ceil(total / per), 1);
    var page = Math.min(Math.max(parseInt(p.get('page'), 10) || 1, 1), pages);
    var start = (page - 1) * per;
    return { ok: true, stations: stations, activeCall: active, logs: list.slice(start, start + per), total: total, page: page, pages: pages, per: per, callsign: dc, lastSync: (D.logsInfo && D.logsInfo.lastSync) || null };
  }
  // ---- 内堂字段映射 (Do-Blog article -> 旧站 article) ----
  function mapArt(a) {
    return {
      id: String(a.id),
      title: a.title || '',
      date: String(a.published_at || a.created_at || '').slice(0, 10),
      cover: a.cover_image || '',
      excerpt: a.excerpt || '',
      content_md: a.content_md || '',
      content: a.content_md || a.content || '',
      likes: a.like_count || 0,
      comments: 0,
      slug: a.slug || ''
    };
  }
  function fetchInner(path) {
    return OF(INNER + path, { headers: { Accept: 'application/json' } }).then(function (r) {
      return r.json();
    }).catch(function () { return null; });
  }
  function fetchInnerPost(path, body) {
    return OF(INNER + path, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(body) }).then(function (r) {
      return r.json();
    }).catch(function () { return null; });
  }
  // 内堂评论 -> 主站评论 {name, date, text}
  function mapComments(list) {
    return (list || []).map(function (c) {
      return { name: c.nickname || 'Q', date: c.created_at || '', text: c.content || '' };
    });
  }
  var GUESTBOOK_ARTICLE = 2; // 内堂「留言板」文章 id
  // 内堂文章列表 -> 旧站 articles (按日期倒序)
  function proxyArticles() {
    return fetchInner('/api/articles?pageSize=50').then(function (j) {
      if (!j || !j.success) {
        // 回退静态数据
        var fallback = (D.articles || []).slice().sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
        return resp({ ok: true, articles: fallback });
      }
      var list = (j.data || []).slice().sort(function (a, b) { return String(b.published_at || '').localeCompare(String(a.published_at || '')); });
      return resp({ ok: true, articles: list.map(mapArt) });
    });
  }
  function proxyArticle(id) {
    return fetchInner('/api/articles/' + encodeURIComponent(id)).then(function (j) {
      if (!j || !j.success) {
        // 回退静态文章
        var fa = (D.articles || []).find(function (x) { return String(x.id) === String(id); });
        if (fa) {
          var fb = Object.assign({}, fa);
          if (!fb.content) fb.content = fb.content_md || '';
          return resp({ ok: true, article: fb, liked: false });
        }
        return resp({ ok: false, error: 'not_found' }, 404);
      }
      var art = mapArt(j.data);
      // 拉取评论数以填充卡片
      return fetchInner('/api/articles/' + encodeURIComponent(id) + '/comments').then(function (cj) {
        if (cj && cj.success) art.comments = (cj.data || []).length;
        return resp({ ok: true, article: art, liked: false });
      });
    });
  }
  function proxyHome() {
    return Promise.all([
      fetchInner('/api/articles?pageSize=5'),
      fetchInner('/api/qso/summary'),
      fetchInner('/api/qso/stats'),
      fetchInner('/api/qso/onair'),
      fetchInner('/api/articles/' + GUESTBOOK_ARTICLE + '/comments')
    ]).then(function (rs) {
      var j = rs[0], qs = rs[1], qst = rs[2], oa = rs[3], g = rs[4];
      var arts = [];
      if (j && j.success) {
        arts = (j.data || []).slice().sort(function (a, b) { return String(b.published_at || '').localeCompare(String(a.published_at || '')); });
      } else {
        // 回退静态数据 (内堂不可达时首页仍有文章)
        arts = (D.articles || []).slice().sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
      }
      var lgs = (qs && qs.ok && Array.isArray(qs.logs)) ? qs.logs : [];
      // 首页统计: 文章数 / 通联数 / 留言数 (内堂优先, 静态兜底)
      var totalArticles = (j && j.success && j.pagination) ? (j.pagination.total || 0) : (j && j.success ? (j.data || []).length : (D.articles || []).length);
      var logCount = (qst && qst.stats) ? qst.stats.total : (D.logs || []).length;
      var messageCount = (g && g.success && Array.isArray(g.data)) ? g.data.length : (D.guestbook || []).length;
      var onAir = (oa && oa.onAirInfo) || D.onAirInfo || null;
      return resp({
        ok: true,
        site: D.site || {},
        onAirInfo: onAir,
        totalArticles: totalArticles,
        logCount: logCount,
        messageCount: messageCount,
        latestArticles: arts.slice(0, 2).map(mapArt),
        latestLogs: lgs
      });
    });
  }
  window.fetch = function (url, opts) {
    var u = String(url);
    var method = ((opts && opts.method) || 'GET').toUpperCase();
    // ---- 静态后台(只读模拟) ----
    if (/\/api\/auth\/login$/.test(u)) return resp({ ok: true, loggedIn: true, user: 'admin' });
    if (/\/api\/auth\/logout$/.test(u)) return resp({ ok: true });
    if (/\/api\/auth\/me$/.test(u)) return resp({ ok: true, loggedIn: true, user: 'admin' });
    if (/\/api\/admin\/stats$/.test(u)) {
      // 统计自内堂实时拉取 (文章/日志/留言/评论)
      return Promise.all([
        fetchInner('/api/articles?pageSize=1'),
        fetchInner('/api/qso/stats'),
        fetchInner('/api/articles/' + GUESTBOOK_ARTICLE + '/comments')
      ]).then(function (rs) {
        var a = rs[0], q = rs[1], g = rs[2];
        var arts = (a && a.success && a.pagination) ? (a.pagination.total || 0) : ((a && a.data ? a.data.length : 0));
        var logs = (q && q.stats) ? q.stats.total : 0;
        var gbs = (g && g.success && Array.isArray(g.data)) ? g.data.length : 0;
        // 兜底: 内堂不可达时以小窝静态数据计数 (永不为零)
        if (!a || !a.success) arts = (D.articles || []).length;
        if (!q || !q.stats) logs = (D.logs || []).length;
        if (!g || !g.success) gbs = (D.guestbook || []).length;
        return resp({ ok: true, articles: arts, logs: logs, guestbook: gbs, comments: gbs, logLikes: 0 });
      });
    }
    if (/\/api\/admin\/site$/.test(u)) return resp({ ok: true, site: D.site || {} });
    if (/\/api\/admin\//.test(u)) return resp({ ok: false, error: '静态版只读：完整后台请部署服务器版' }, 400);
    // ---- 评论/留言/点赞: 转发内堂 (POST 放行) ----
    var likeM = u.match(/\/api\/articles\/([^/?#]+)\/like$/);
    if (likeM && method === 'POST') {
      return fetchInnerPost('/api/articles/' + encodeURIComponent(likeM[1]) + '/like', {}).then(function (j) {
        if (!j || j.success === false) return resp({ ok: false, error: 'like_failed' }, 400);
        return resp({ ok: true, liked: !!(j.data && j.data.liked), count: 0 });
      });
    }
    if (/\/api\.php\?action=addcomment/.test(u) && method === 'POST') {
      return (opts && opts.body ? Promise.resolve(opts.body) : Promise.resolve('{}')).then(function (raw) {
        var b = {}; try { b = JSON.parse(raw); } catch (e) {}
        return fetchInnerPost('/api/articles/' + encodeURIComponent(String(b.article || '')) + '/comments', { nickname: b.name || '', email: '', content: b.text || '' });
      }).then(function (j) {
        if (!j || !j.success) return resp({ ok: false, error: 'comment_failed' }, 400);
        return resp({ ok: true });
      });
    }
    if (/\/api\.php\?action=addguestbook/.test(u) && method === 'POST') {
      return (opts && opts.body ? Promise.resolve(opts.body) : Promise.resolve('{}')).then(function (raw) {
        var b = {}; try { b = JSON.parse(raw); } catch (e) {}
        return fetchInnerPost('/api/articles/' + GUESTBOOK_ARTICLE + '/comments', { nickname: b.name || '', email: '', content: b.text || '' });
      }).then(function (j) {
        if (!j || !j.success) return resp({ ok: false, error: 'guestbook_failed' }, 400);
        return resp({ ok: true });
      });
    }
    // ---- 其余写操作一律只读提示 ----
    if (method !== 'GET') return resp({ ok: false, error: '静态导出仅支持浏览，评论/点赞/留言/后台需在线服务运行' }, 400);
    // ---- 内堂代理: 文章动态化 ----
    if (/\/api\/home$/.test(u)) return proxyHome();
    var ma = u.match(/\/api\/articles\/([^/?#]+)/);
    if (ma) return proxyArticle(decodeURIComponent(ma[1]));
    if (/\/api\/articles$/.test(u)) return proxyArticles();
    var cm = u.match(/\/api\.php\?action=comments&article=([^&]+)/);
    if (cm) {
      return fetchInner('/api/articles/' + encodeURIComponent(decodeURIComponent(cm[1])) + '/comments').then(function (j) {
        if (!j || !j.success) return resp({ ok: true, comments: [] });
        return resp({ ok: true, comments: mapComments(j.data) });
      });
    }
    if (/\/api\.php\?action=guestbook/.test(u)) {
      return fetchInner('/api/articles/' + GUESTBOOK_ARTICLE + '/comments').then(function (j) {
        if (!j || !j.success) return resp({ ok: true, messages: [] });
        return resp({ ok: true, messages: mapComments(j.data).map(function (m) { return { name: m.name, text: m.text, date: m.date }; }) });
      });
    }
    // ---- 静态数据 ----
    if (/\/api\/logs/.test(u)) {
      // 转发内堂 QSO 列表 (兼容旧站格式)
      return fetchInner('/api/qso/list' + (u.indexOf('?') >= 0 ? u.slice(u.indexOf('?')) : '')).then(function (j) {
        if (!j || !j.ok) return resp({ ok: true, stations: [], activeCall: dc, logs: [], total: 0, page: 1, pages: 1, per: 30, callsign: dc, lastSync: null });
        return resp(j);
      });
    }
    if (/\/api\/site$/.test(u)) return resp({ ok: true, site: D.site || {} });
    if (/\/api\/copy$/.test(u)) return resp({ ok: true, copy: D.copy || {} });
    if (/\/api\/guestbook$/.test(u)) return resp({ ok: true, messages: (D.guestbook || []).filter(function (m) { return m.status !== 'hidden'; }) });
    var mbs = u.match(/bbs\.bg4lzn\.cn\/api\.php.*action=comments.*article=([^&]+)/);
    if (mbs) { var aid = decodeURIComponent(mbs[1]); return resp({ ok: true, comments: (D.bbsComments || {})[aid] || [] }); }
    if (/bbs\.bg4lzn\.cn\/api\.php.*action=guestbook/.test(u)) return resp({ ok: true, messages: (D.guestbook || []).filter(function (m) { return m.status !== 'hidden'; }) });
    return OF.apply(this, arguments);
  };
})();
</script>
</head>
<body>
  <div class="bg-orb"><div class="orb o1"></div><div class="orb o2"></div></div>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="logo-row">
        <div class="logo"><img src="https://i.ibb.co/wh8QLjNp/picture.jpg" alt="BG4LZN"></div>
        <div><div class="t">电波小窝 · Admin</div><div class="s">RADIO NOOK</div></div>
      </div>
      <div class="field"><label>账号 Username</label><input id="user" value="admin"></div>
      <div class="field"><label>密码 Password</label><input id="pass" type="password" placeholder="••••••"></div>
      <div class="err" id="err"></div>
      <button class="btn accent full" id="loginBtn">登 录</button>
      <a href="./index.html#/home" class="back">← 返回小屋首页</a>
    </div>
  </div>

  <script>
    const btn = document.getElementById('loginBtn');
    async function doLogin() {
      const username = document.getElementById('user').value.trim();
      const password = document.getElementById('pass').value;
      const err = document.getElementById('err');
      err.textContent = '';
      btn.disabled = true; btn.textContent = '登录中…';
      try {
        const r = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) });
        const d = await r.json();
        if (d.ok) { location.href = './admin.html'; return; }
        err.textContent = d.error === 'invalid' ? '账号或密码错误' : '登录失败';
      } catch (e) { err.textContent = '网络错误'; }
      btn.disabled = false; btn.textContent = '登 录';
    }
    btn.onclick = doLogin;
    document.getElementById('pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
