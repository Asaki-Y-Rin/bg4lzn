<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BG4LZN 的电波小窝 · Welcome</title>
  <link rel="icon" href="https://i.ibb.co/wh8QLjNp/picture.jpg" type="image/jpeg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; color: #fff;
    }
    .stage { position: relative; height: 100vh; width: 100vw; overflow: hidden; }
    .bg {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0;
    }
    .scrim { position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(60,40,30,.30), rgba(30,20,15,.55) 80%); backdrop-filter: blur(1px); }
    .content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 24px; }
    .kicker { letter-spacing: 6px; font-size: 13px; text-transform: uppercase; opacity: .85; font-weight: 600; margin-bottom: 18px; }
    h1.title { font-size: clamp(38px, 7vw, 72px); font-weight: 800; letter-spacing: 3px; line-height: 1.15; text-shadow: 0 8px 40px rgba(0,0,0,.45); }
    .sub { margin-top: 16px; font-size: clamp(14px, 2vw, 18px); opacity: .95; letter-spacing: 1px; }
    .callsign { margin-top: 22px; font-size: 15px; letter-spacing: 4px; opacity: .85; }
    .enter {
      margin-top: 40px; padding: 15px 46px; border-radius: 100px; font-size: 16px; font-weight: 700;
      background: #fff; color: #3a3530; border: none; cursor: pointer; letter-spacing: 2px;
      box-shadow: 0 14px 40px rgba(0,0,0,.30); transition: transform .22s ease, box-shadow .22s ease, background .22s;
    }
    .enter:hover { transform: translateY(-3px); background: #fdeee6; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
    .lang {
      position: absolute; top: 26px; right: 30px; z-index: 3; display: flex; gap: 3px;
      background: rgba(255,255,255,.16); backdrop-filter: blur(10px); border-radius: 100px; padding: 4px; border: 1px solid rgba(255,255,255,.25);
    }
    .lang button { border: none; background: none; color: #fff; padding: 6px 14px; border-radius: 100px; font-size: 13px; font-weight: 700; cursor: pointer; opacity: .8; transition: all .2s; }
    .lang button.active { background: #fff; color: #3a3530; opacity: 1; }
    .hint { position: absolute; bottom: 26px; left: 0; right: 0; z-index: 3; text-align: center; font-size: 12px; opacity: .7; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="stage">
    <img class="bg" src="/backgroud/backgroud.gif" alt="">
    <div class="scrim"></div>

    <div class="lang">
      <button data-lang="zh" class="active">中</button>
      <button data-lang="en">EN</button>
    </div>

    <div class="content">
      <div class="kicker" data-i18n="kicker">AMATEUR RADIO · 业余无线电</div>
      <h1 class="title" data-i18n="title">BG4LZN 的电波小窝</h1>
      <div class="sub" data-i18n="sub">点击进入，一起拥抱世界。</div>
      <div class="callsign">GL! DE BG4LZN</div>
      <button class="enter" data-i18n="enter" onclick="location.href='/home'">进入小屋</button>
    </div>

    <div class="hint" data-i18n="hint">Scroll · BG4LZN · Shandong Tai'an · Class B</div>
  </div>

  <script>
    const dict = {
      zh: {
        kicker: 'AMATEUR RADIO · 业余无线电',
        title: 'BG4LZN 的电波小窝',
        sub: '点击进入，一起拥抱世界。',
        enter: '进入小屋',
        hint: '山东泰安 · B 类操作员 · ARRL LoTW'
      },
      en: {
        kicker: 'AMATEUR RADIO · 业余无线电',
        title: "BG4LZN's Radio Shack",
        sub: "Step in and reach the world.",
        enter: 'Enter the Shack',
        hint: "Shandong Tai'an · Class B · ARRL LoTW"
      }
    };
    let lang = localStorage.getItem('bh_lang') || 'zh';
    function apply() {
      const d = dict[lang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.dataset.i18n;
        if (d[k] !== undefined) el.textContent = d[k];
      });
      document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      document.title = d.title + ' · Welcome';
    }
    document.querySelectorAll('.lang button').forEach(b => {
      b.addEventListener('click', () => { lang = b.dataset.lang; localStorage.setItem('bh_lang', lang); apply(); });
    });
    apply();
  </script>
</body>
</html>
